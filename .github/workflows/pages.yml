name: Build and publish page

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Download pinned Doctave
        env:
          DOCTAVE_SHA256: 90f468fa8f50beacee2741bd822143809f0a2ba5ca5659ca5507cc5d8813a1be
        run: |
          curl --fail --location --silent --show-error --retry 3 \
            https://github.com/Doctave/doctave/releases/download/0.4.2/doctave-0.4.2-x86_64-unknown-linux-musl.tar.gz \
            -o "$RUNNER_TEMP/doctave.tar.gz"
          printf '%s  %s\n' "$DOCTAVE_SHA256" "$RUNNER_TEMP/doctave.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/doctave.tar.gz" -C "$RUNNER_TEMP" \
            doctave-0.4.2-x86_64-unknown-linux-musl/doctave
      - name: Build and check links
        run: |
          "$RUNNER_TEMP/doctave-0.4.2-x86_64-unknown-linux-musl/doctave" --version
          "$RUNNER_TEMP/doctave-0.4.2-x86_64-unknown-linux-musl/doctave" build --release
          test -s site/index.html
          test -f site/.nojekyll
      - name: Upload site only
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: site/

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
