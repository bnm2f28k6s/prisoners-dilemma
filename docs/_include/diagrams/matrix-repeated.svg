<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 620" width="760" role="img" aria-labelledby="title description">
<title id="title">Same square. Now visit one cell each round.</title>
<desc id="description">The payoff square is unchanged. Tit for tat versus always defect visits C/D in round 1, then D/D in rounds 2, 3, and 4. Stage payoffs are (0, 5), (1, 1), (1, 1), (1, 1). Totals are (3, 8).</desc>
<rect width="760" height="100%" rx="18" fill="#fff"/>
<g font-family="system-ui, -apple-system, sans-serif" fill="#172033">
<text x="28" y="34" font-size="20" fill="#172033" text-anchor="start" font-weight="700">THE PAYOFF MATRIX</text>
<text x="28" y="64" font-size="17" fill="#172033" text-anchor="start" font-weight="400">Same square. Now visit one cell each round.</text>
<text x="448" y="100" font-size="18" fill="#7c3aed" text-anchor="middle" font-weight="700">COLUMN →</text>
<text x="28" y="144" font-size="18" fill="#1d4ed8" text-anchor="start" font-weight="700">ROW ↓</text>
<text x="308" y="138" font-size="20" fill="#7c3aed" text-anchor="middle" font-weight="600">C · cooperate</text>
<text x="88" y="226" font-size="24" fill="#1d4ed8" text-anchor="middle" font-weight="700">C</text>
<text x="88" y="251" font-size="16" fill="#1d4ed8" text-anchor="middle" font-weight="400">cooperate</text>
<text x="588" y="138" font-size="20" fill="#7c3aed" text-anchor="middle" font-weight="600">D · defect</text>
<text x="88" y="346" font-size="24" fill="#1d4ed8" text-anchor="middle" font-weight="700">D</text>
<text x="88" y="371" font-size="16" fill="#1d4ed8" text-anchor="middle" font-weight="400">defect</text>
<g data-cell="0,0">
<rect x="168" y="160" width="280" height="120" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
<text x="308" y="234" text-anchor="middle" font-size="34" font-weight="650">
<tspan fill="#475569">(</tspan>
<tspan fill="#1d4ed8" data-player="0">3</tspan>
<tspan fill="#475569">, </tspan>
<tspan fill="#7c3aed" data-player="1">3</tspan>
<tspan fill="#475569">)</tspan></text>
</g>
<g data-cell="0,1">
<rect x="448" y="160" width="280" height="120" fill="#eef8f7" stroke="#0f766e" stroke-width="3"/>
<text x="588" y="182" font-size="14" fill="#115e59" text-anchor="middle" font-weight="600">round 1</text>
<text x="588" y="234" text-anchor="middle" font-size="34" font-weight="650">
<tspan fill="#475569">(</tspan>
<tspan fill="#1d4ed8" data-player="0">0</tspan>
<tspan fill="#475569">, </tspan>
<tspan fill="#7c3aed" data-player="1">5</tspan>
<tspan fill="#475569">)</tspan></text>
</g>
<g data-cell="1,0">
<rect x="168" y="280" width="280" height="120" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
<text x="308" y="354" text-anchor="middle" font-size="34" font-weight="650">
<tspan fill="#475569">(</tspan>
<tspan fill="#1d4ed8" data-player="0">5</tspan>
<tspan fill="#475569">, </tspan>
<tspan fill="#7c3aed" data-player="1">0</tspan>
<tspan fill="#475569">)</tspan></text>
</g>
<g data-cell="1,1">
<rect x="448" y="280" width="280" height="120" fill="#eef8f7" stroke="#0f766e" stroke-width="3"/>
<text x="588" y="302" font-size="14" fill="#115e59" text-anchor="middle" font-weight="600">rounds 2-4</text>
<text x="588" y="354" text-anchor="middle" font-size="34" font-weight="650">
<tspan fill="#475569">(</tspan>
<tspan fill="#1d4ed8" data-player="0">1</tspan>
<tspan fill="#475569">, </tspan>
<tspan fill="#7c3aed" data-player="1">1</tspan>
<tspan fill="#475569">)</tspan></text>
</g>
<text x="28" y="434" font-size="17" fill="#172033" text-anchor="start" font-weight="400">Payoff order:</text>
<text x="150" y="434" font-size="17" fill="#1d4ed8" text-anchor="start" font-weight="600">Row first</text>
<text x="255" y="434" font-size="17" fill="#7c3aed" text-anchor="start" font-weight="600">Column second</text>
<rect x="28" y="454" width="164" height="104" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="110" y="478" font-size="17" fill="#172033" text-anchor="middle" font-weight="400">Round 1</text>
<text x="110" y="506" font-size="21" fill="#172033" text-anchor="middle" font-weight="600">C, D</text>
<text x="110" y="541" text-anchor="middle" font-size="25" font-weight="650">
<tspan fill="#475569">(</tspan>
<tspan fill="#1d4ed8" data-player="0">0</tspan>
<tspan fill="#475569">, </tspan>
<tspan fill="#7c3aed" data-player="1">5</tspan>
<tspan fill="#475569">)</tspan></text>
<rect x="208" y="454" width="164" height="104" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="290" y="478" font-size="17" fill="#172033" text-anchor="middle" font-weight="400">Round 2</text>
<text x="290" y="506" font-size="21" fill="#172033" text-anchor="middle" font-weight="600">D, D</text>
<text x="290" y="541" text-anchor="middle" font-size="25" font-weight="650">
<tspan fill="#475569">(</tspan>
<tspan fill="#1d4ed8" data-player="0">1</tspan>
<tspan fill="#475569">, </tspan>
<tspan fill="#7c3aed" data-player="1">1</tspan>
<tspan fill="#475569">)</tspan></text>
<rect x="388" y="454" width="164" height="104" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="470" y="478" font-size="17" fill="#172033" text-anchor="middle" font-weight="400">Round 3</text>
<text x="470" y="506" font-size="21" fill="#172033" text-anchor="middle" font-weight="600">D, D</text>
<text x="470" y="541" text-anchor="middle" font-size="25" font-weight="650">
<tspan fill="#475569">(</tspan>
<tspan fill="#1d4ed8" data-player="0">1</tspan>
<tspan fill="#475569">, </tspan>
<tspan fill="#7c3aed" data-player="1">1</tspan>
<tspan fill="#475569">)</tspan></text>
<rect x="568" y="454" width="164" height="104" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="650" y="478" font-size="17" fill="#172033" text-anchor="middle" font-weight="400">Round 4</text>
<text x="650" y="506" font-size="21" fill="#172033" text-anchor="middle" font-weight="600">D, D</text>
<text x="650" y="541" text-anchor="middle" font-size="25" font-weight="650">
<tspan fill="#475569">(</tspan>
<tspan fill="#1d4ed8" data-player="0">1</tspan>
<tspan fill="#475569">, </tspan>
<tspan fill="#7c3aed" data-player="1">1</tspan>
<tspan fill="#475569">)</tspan></text>
<text x="28" y="592" font-size="19" fill="#172033" text-anchor="start" font-weight="600">Add stage payoffs separately. Match totals: Row 3, Column 8.</text>
</g>
</svg>
