</g>
<g data-cell="2,2">
<rect x="541.333" y="320" width="186.667" height="80" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
<text x="634.667" y="374" text-anchor="middle" font-size="28" font-weight="650">
<tspan fill="#475569">(</tspan>
<tspan fill="#1d4ed8" data-player="0">2</tspan>
<tspan fill="#475569">, </tspan>
<tspan fill="#7c3aed" data-player="1">2</tspan>
<tspan fill="#475569">, </tspan>
<tspan fill="#475569" data-player="2">8</tspan>
<tspan fill="#475569">)</tspan></text>
</g>
<text x="28" y="434" font-size="17" fill="#172033" text-anchor="start" font-weight="400">Payoff order:</text>
<text x="150" y="434" font-size="17" fill="#1d4ed8" text-anchor="start" font-weight="600">Row first</text>
<text x="255" y="434" font-size="17" fill="#7c3aed" text-anchor="start" font-weight="600">Column second</text>
<text x="425" y="434" font-size="17" fill="#475569" text-anchor="start" font-weight="600">third player last</text>
<text x="28" y="470" font-size="17" fill="#172033" text-anchor="start" font-weight="400">Payoffs now list (Row, Column, third player). Third action = 0.</text>
<text x="28" y="498" font-size="17" fill="#172033" text-anchor="start" font-weight="400">This is one slice, not the full three-player game.</text>
</g>
</svg>
